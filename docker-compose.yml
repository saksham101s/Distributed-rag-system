services:
  coordinator:
    build:
      context: .
      target: coordinator
    container_name: rag_coordinator
    ports:
      - "8000:8000"
    environment:
      - SHARD_NODES=shard_0=shard_0:50051,shard_1=shard_1:50052,shard_2=shard_2:50053
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - LLM_PROVIDER=${LLM_PROVIDER:-mock}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - REPLICATION_FACTOR=2
      - VIRTUAL_NODES=100
      - SHARD_TIMEOUT_SECONDS=1.5
      - CHAOS_ENABLED=${CHAOS_ENABLED:-false}
      - API_KEY=${API_KEY:-}
    depends_on:
      - shard_0
      - shard_1
      - shard_2
      - redis

  shard_0:
    build:
      context: .
      target: shard
    container_name: rag_shard_0
    command: python shard_node/shard_service.py --shard-id shard_0 --port 50051
    environment:
      - CHAOS_ENABLED=${CHAOS_ENABLED:-false}
    ports:
      - "50051:50051"

  shard_1:
    build:
      context: .
      target: shard
    container_name: rag_shard_1
    command: python shard_node/shard_service.py --shard-id shard_1 --port 50052
    environment:
      - CHAOS_ENABLED=${CHAOS_ENABLED:-false}
    ports:
      - "50052:50052"

  shard_2:
    build:
      context: .
      target: shard
    container_name: rag_shard_2
    command: python shard_node/shard_service.py --shard-id shard_2 --port 50053
    environment:
      - CHAOS_ENABLED=${CHAOS_ENABLED:-false}
    ports:
      - "50053:50053"

  redis:
    image: redis:7-alpine
    container_name: rag_redis
    ports:
      - "6379:6379"

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: rag_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml
