<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Distributed RAG System — Real-time Visualizer & Chat UI</title>
  
  <!-- Modern Google Font: Outfit & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <!-- Babel CDN for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --bg-primary: #0b0f19;
      --bg-card: rgba(17, 24, 39, 0.7);
      --bg-card-hover: rgba(31, 41, 55, 0.8);
      --border-color: rgba(255, 255, 255, 0.1);
      --accent-cyan: #06b6d4;
      --accent-purple: #8b5cf6;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-primary);
      color: var(--text-main);
      min-height: 100vh;
      background-image: 
        radial-gradient(at 10% 10%, rgba(6, 182, 212, 0.12) 0px, transparent 50%),
        radial-gradient(at 90% 90%, rgba(139, 92, 246, 0.12) 0px, transparent 50%);
      background-attachment: fixed;
    }

    header {
      padding: 1.5rem 2rem;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(11, 15, 25, 0.8);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand-logo {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
      border-radius: 10px;
      display: grid;
      place-items: center;
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 1.25rem;
      box-shadow: 0 4px 15px rgba(6, 182, 212, 0.4);
    }

    .brand-title h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .brand-title p {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.35rem 0.85rem;
      border-radius: 9999px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #34d399;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #34d399;
      box-shadow: 0 0 10px #34d399;
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.4); opacity: 0.5; }
    }

    main {
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem;
      display: grid;
      grid-template-columns: 1fr 400px;
      gap: 2rem;
    }

    @media (max-width: 1024px) {
      main { grid-template-columns: 1fr; }
    }

    .glass-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 1.5rem;
      backdrop-filter: blur(16px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.25rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border-color);
    }

    .section-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* Chat Section */
    .chat-container {
      display: flex;
      flex-direction: column;
      height: 600px;
    }

    .messages-list {
      flex: 1;
      overflow-y: auto;
      padding-right: 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .message-card {
      padding: 1.25rem;
      border-radius: 12px;
      line-height: 1.6;
    }

    .user-msg {
      background: rgba(6, 182, 212, 0.1);
      border: 1px solid rgba(6, 182, 212, 0.3);
      align-self: flex-end;
      max-width: 85%;
    }

    .assistant-msg {
      background: rgba(31, 41, 55, 0.6);
      border: 1px solid var(--border-color);
      align-self: flex-start;
      width: 100%;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
      font-size: 0.7rem;
      font-weight: 600;
      margin-right: 0.5rem;
    }

    .badge-cyan { background: rgba(6, 182, 212, 0.2); color: #22d3ee; border: 1px solid rgba(6, 182, 212, 0.3); }
    .badge-purple { background: rgba(139, 92, 246, 0.2); color: #a78bfa; border: 1px solid rgba(139, 92, 246, 0.3); }
    .badge-green { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }

    .input-box {
      margin-top: 1rem;
      display: flex;
      gap: 0.75rem;
    }

    input[type="text"], textarea {
      width: 100%;
      background: rgba(17, 24, 39, 0.9);
      border: 1px solid var(--border-color);
      padding: 0.85rem 1.25rem;
      border-radius: 10px;
      color: var(--text-main);
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus, textarea:focus {
      border-color: var(--accent-cyan);
    }

    button {
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
      color: white;
      border: none;
      padding: 0.85rem 1.5rem;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    button:hover { opacity: 0.9; transform: translateY(-1px); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Shard Topology Cards */
    .nodes-grid {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .node-card {
      background: rgba(31, 41, 55, 0.4);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: border-color 0.2s;
    }

    .node-card.healthy { border-left: 4px solid var(--accent-green); }
    .node-card.unhealthy { border-left: 4px solid var(--accent-red); opacity: 0.6; }

    .node-info h4 {
      font-family: 'Outfit', sans-serif;
      font-size: 0.95rem;
    }

    .node-info p {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .sources-list {
      margin-top: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }

    .source-item {
      background: rgba(17, 24, 39, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      padding: 0.75rem;
      font-size: 0.825rem;
    }

    .telemetry-bar {
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      overflow: hidden;
      margin-top: 0.35rem;
    }

    .telemetry-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple));
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const API_BASE = "http://localhost:8000";

    function App() {
      const [query, setQuery] = useState("");
      const [messages, setMessages] = useState([
        {
          role: "assistant",
          answer: "Hello! I am your Distributed RAG Assistant. Ask me any question, and I'll fan out queries across sharded FAISS vector nodes using consistent hashing!",
          sources: [],
          telemetry: null,
          provider_used: "System Init"
        }
      ]);
      const [loading, setLoading] = useState(false);
      const [clusterStatus, setClusterStatus] = useState(null);
      const [ingestDocId, setIngestDocId] = useState("");
      const [ingestText, setIngestText] = useState("");
      const [ingestStatus, setIngestStatus] = useState("");

      const fetchClusterStatus = async () => {
        try {
          const res = await fetch(`${API_BASE}/api/v1/cluster/status`);
          if (res.ok) {
            const data = await res.json();
            setClusterStatus(data);
          }
        } catch (err) {
          console.error("Cluster status fetch error:", err);
        }
      };

      useEffect(() => {
        fetchClusterStatus();
        const interval = setInterval(fetchClusterStatus, 2000);
        return () => clearInterval(interval);
      }, []);

      const handleSendQuery = async (e) => {
        e?.preventDefault();
        if (!query.trim() || loading) return;

        const userText = query;
        setQuery("");
        setMessages(prev => [...prev, { role: "user", text: userText }]);
        setLoading(true);

        try {
          const res = await fetch(`${API_BASE}/api/v1/query`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ query: userText, top_k: 5 })
          });

          if (!res.ok) throw new Error("API request failed");
          const data = await res.json();

          setMessages(prev => [
            ...prev,
            {
              role: "assistant",
              answer: data.answer,
              sources: data.sources || [],
              telemetry: data.telemetry || null,
              provider_used: data.provider_used,
              cached: data.cached
            }
          ]);
        } catch (err) {
          setMessages(prev => [
            ...prev,
            {
              role: "assistant",
              answer: `Error: Unable to connect to Coordinator API (${err.message}). Make sure coordinator_service.py is running on port 8000.`,
              sources: [],
              telemetry: null,
              provider_used: "Error"
            }
          ]);
        } finally {
          setLoading(false);
          fetchClusterStatus();
        }
      };

      const handleIngestDocument = async (e) => {
        e.preventDefault();
        if (!ingestDocId.trim() || !ingestText.trim()) return;

        setIngestStatus("Ingesting & distributing across hash ring...");
        try {
          const res = await fetch(`${API_BASE}/api/v1/documents/ingest`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              doc_id: ingestDocId,
              text: ingestText,
              replication_factor: 2
            })
          });

          if (!res.ok) throw new Error("Ingest failed");
          const data = await res.json();
          setIngestStatus(`✅ Ingested ${data.chunks_created} chunks -> Target Shards: [${data.target_shards.join(", ")}]`);
          setIngestDocId("");
          setIngestText("");
          fetchClusterStatus();
        } catch (err) {
          setIngestStatus(`❌ Ingest Error: ${err.message}`);
        }
      };

      return (
        <div>
          <header>
            <div className="brand">
              <div className="brand-logo">RAG</div>
              <div className="brand-title">
                <h1>Distributed RAG Engine</h1>
                <p>Consistent Hashing &bull; gRPC Scatter-Gather &bull; Replication &bull; FAISS</p>
              </div>
            </div>
            <div className="status-pill">
              <div className="pulse-dot"></div>
              <span>{clusterStatus ? `${clusterStatus.healthy_nodes}/${clusterStatus.total_nodes} Shards Active` : "Connecting..."}</span>
            </div>
          </header>

          <main>
            {/* Left Column: Chat Console */}
            <div className="glass-card chat-container">
              <div className="section-header">
                <div className="section-title">
                  <span>💬 Interactive Scatter-Gather Query Console</span>
                </div>
              </div>

              <div className="messages-list">
                {messages.map((m, idx) => (
                  <div key={idx} className={`message-card ${m.role === 'user' ? 'user-msg' : 'assistant-msg'}`}>
                    {m.role === 'user' ? (
                      <div><strong>You:</strong> {m.text}</div>
                    ) : (
                      <div>
                        <div style={{ marginBottom: "0.5rem" }}>
                          <span className="badge badge-purple">{m.provider_used}</span>
                          {m.cached && <span className="badge badge-cyan">⚡ Redis Cache Hit</span>}
                          {m.telemetry?.degraded && <span className="badge badge-red">⚠️ Degraded Mode</span>}
                        </div>
                        <p style={{ whiteSpace: "pre-wrap" }}>{m.answer}</p>

                        {/* Telemetry Breakdown */}
                        {m.telemetry && (
                          <div style={{ marginTop: "1rem", paddingTop: "0.75rem", borderTop: "1px solid var(--border-color)", fontSize: "0.75rem", color: "var(--text-muted)" }}>
                            <div style={{ display: "flex", justifyContent: "space-between", marginBottom: "0.25rem" }}>
                              <span>⚡ Scatter-Gather Fan-out Latency: <strong>{m.telemetry.total_scatter_latency_ms} ms</strong></span>
                              <span>Successful Shards: {m.telemetry.shards_successful}/{m.telemetry.shards_queried}</span>
                            </div>
                          </div>
                        )}

                        {/* Cited Sources */}
                        {m.sources && m.sources.length > 0 && (
                          <div className="sources-list">
                            <strong style={{ fontSize: "0.75rem", color: "var(--accent-cyan)" }}>Retrieved Vector Context Sources:</strong>
                            {m.sources.map((s, sIdx) => (
                              <div key={sIdx} className="source-item">
                                <div style={{ display: "flex", justifyContent: "space-between", marginBottom: "0.25rem" }}>
                                  <span className="badge badge-cyan">Shard: {s.shard_id}</span>
                                  <span>Doc ID: <strong>{s.doc_id}</strong> &bull; Score: {(s.score).toFixed(4)}</span>
                                </div>
                                <p style={{ color: "var(--text-main)", fontSize: "0.8rem" }}>"{s.text}"</p>
                              </div>
                            ))}
                          </div>
                        )}
                      </div>
                    )}
                  </div>
                ))}
                {loading && (
                  <div className="message-card assistant-msg">
                    <span className="badge badge-cyan">Fan-out gRPC Search...</span>
                    <span>Querying vector shard ring concurrently...</span>
                  </div>
                )}
              </div>

              <form onSubmit={handleSendQuery} className="input-box">
                <input
                  type="text"
                  placeholder="Ask a query (e.g. 'How does consistent hashing work?')..."
                  value={query}
                  onChange={(e) => setQuery(e.target.value)}
                />
                <button type="submit" disabled={loading}>Send Query</button>
              </form>
            </div>

            {/* Right Column: Cluster Topology & Ingestion */}
            <div style={{ display: "flex", flexDirection: "column", gap: "1.5rem" }}>
              {/* Cluster Nodes Card */}
              <div className="glass-card">
                <div className="section-header">
                  <div className="section-title">
                    <span>🌐 Vector Shard Ring Topology</span>
                  </div>
                </div>

                <div className="nodes-grid">
                  {clusterStatus?.nodes?.map((node) => (
                    <div key={node.shard_id} className={`node-card ${node.healthy ? 'healthy' : 'unhealthy'}`}>
                      <div className="node-info">
                        <h4>{node.shard_id}</h4>
                        <p>{node.address}</p>
                      </div>
                      <div style={{ textAlign: "right" }}>
                        <span className={`badge ${node.healthy ? 'badge-green' : 'badge-red'}`}>
                          {node.healthy ? 'HEALTHY' : 'UNREACHABLE'}
                        </span>
                        <p style={{ marginTop: "0.25rem", fontSize: "0.75rem" }}>
                          {node.vector_count} Vectors ({node.ring_share_pct}% Ring)
                        </p>
                      </div>
                    </div>
                  ))}
                </div>
              </div>

              {/* Document Ingestion Card */}
              <div className="glass-card">
                <div className="section-header">
                  <div className="section-title">
                    <span>📥 Ingest New Document</span>
                  </div>
                </div>

                <form onSubmit={handleIngestDocument} style={{ display: "flex", flexDirection: "column", gap: "0.85rem" }}>
                  <input
                    type="text"
                    placeholder="Document ID (e.g. doc_raft_paper)"
                    value={ingestDocId}
                    onChange={(e) => setIngestDocId(e.target.value)}
                  />
                  <textarea
                    rows="4"
                    placeholder="Paste raw text to chunk, embed, and hash-route to target primary + replica shards..."
                    value={ingestText}
                    onChange={(e) => setIngestText(e.target.value)}
                  />
                  <button type="submit">Ingest & Distribute Vectors</button>
                </form>

                {ingestStatus && (
                  <p style={{ marginTop: "0.75rem", fontSize: "0.8rem", color: "var(--accent-cyan)" }}>
                    {ingestStatus}
                  </p>
                )}
              </div>
            </div>
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
